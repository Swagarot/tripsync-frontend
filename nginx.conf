server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text (JS, CSS, HTML, JSON, SVG): the main JS file goes from
    # ~375 kB to ~120 kB on the wire. Cloudflare compresses the public site
    # by itself, but on the LAN/Tailscale address nginx is talking directly
    # to the browser. Images and map tiles are already compressed formats.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Unknown paths (/trips/<id>) get index.html; React's router takes over.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html names the current JS/CSS files, so the browser must check
        # for a new one on every visit ("no-cache" = revalidate, not "never store").
        add_header Cache-Control "no-cache";
    }

    # The service worker and its manifest decide when a new version is
    # installed. If the browser cached them, users could be stuck on an old
    # version, so always revalidate.
    location ~ ^/(sw\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        # nginx's built-in type list doesn't know .webmanifest.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in every asset name (index-B2l-JJhq.js): a
    # changed file gets a new name, so these can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
